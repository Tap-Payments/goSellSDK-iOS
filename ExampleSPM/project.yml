# goSellSDK example installed with Swift Package Manager.
#
# It builds the same app as ../Example (CocoaPods): the sources, storyboards and assets are shared
# from ../Example/goSellSDKExample. goSellSDK comes from this repository as a local package, so
# changes to the SDK show up here directly.
#
# The Xcode project is generated from this file with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   cd ExampleSPM && xcodegen generate
name: goSellSDKExampleSPM
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  goSellSDK:
    path: ..
targets:
  goSellSDKExample:
    type: application
    platform: iOS
    sources:
      - path: ../Example/goSellSDKExample
        excludes:
          - "Supporting Files/Info.plist"
          - "goSellSDKExample.entitlements"
          - "Supporting Files/Keys.json"
          - "Supporting Files/Keys.example.json"
    dependencies:
      - package: goSellSDK
        product: goSellSDK
    settings:
      base:
        PRODUCT_NAME: goSellSDKExample
        PRODUCT_MODULE_NAME: goSellSDKExample
        PRODUCT_BUNDLE_IDENTIFIER: company.tap.goSellSDKExamplee
        INFOPLIST_FILE: ../Example/goSellSDKExample/Supporting Files/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../Example/goSellSDKExample/goSellSDKExample.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G46S76PUH4
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "4.2"
        MARKETING_VERSION: "2.4.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The "Copy Keys.json" step reads a file outside the build inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Copy Keys.json
        basedOnDependencyAnalysis: false
        script: |
          # Keys.json is git-ignored; copy Keys.example.json to Keys.json and add your Tap keys.
          KEYS="${SRCROOT}/../Example/goSellSDKExample/Supporting Files/Keys.json"
          if [ -f "$KEYS" ]; then
            cp "$KEYS" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Keys.json"
          else
            echo "warning: Keys.json not found. Copy Keys.example.json to Keys.json in Example/goSellSDKExample/Supporting Files and add your Tap keys."
          fi
schemes:
  goSellSDKExampleSPM:
    build:
      targets:
        goSellSDKExample: all
    run:
      config: Debug
    archive:
      config: Release
